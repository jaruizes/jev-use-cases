services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:4200
      LAYA_BASE_URL: http://laya:8000
      LAYA_TIMEOUT_SECONDS: ${LAYA_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    volumes:
      - pricing-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  laya:
    build: ./laya
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_DEVICE: cpu
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_MAX_LOADED: 1
      LAYA_PRELOAD: 0
      OMP_NUM_THREADS: 4
      HF_HOME: /models/huggingface
    volumes:
      - laya-models:/models/huggingface
    # No published port: API reaches http://laya:8000 inside the Compose network.
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pricing-data:
  laya-models:
